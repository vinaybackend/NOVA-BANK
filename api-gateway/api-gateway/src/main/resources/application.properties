spring.application.name=api-gateway
server.port=9090

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# Spring Cloud Gateway + Eureka
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.gateway.access=read-only
management.info.env.enabled=true

jwt.secret=kjdfnkjdnfekjfkdjnvfkjnvfkjndkvncmnknskdjnjnfksndknskdcnskvnskjnvksdncksdncksdnkcdnkdknkdvfnkv

#resilience

#number of calls that are recorded when the circuit breaker is closed before it calculates the failure rate
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10

#number of calls that are recorded when the circuit breaker is closed before it calculates the failure rate
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10000

#time in seconds that the circuit breaker should wait before transitioning from open to half-open state
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=2

#failure rate threshold in percentage above which the circuit breaker trips and goes to open state
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

